# BFX1 iOS 冒烟流程（Maestro）
# 无硬件时用 App 自带「演示模式」连虚拟设备，再走主界面 / 本地库 / 预设库 / 社区 / 账号。
# 文案同时匹配中英文；关键步骤前后都截图，失败时便于定位。
appId: com.bfx1.processor
---
- launchApp:
    clearState: true

# 0) 先留一张启动截图（若启动慢/白屏，从这张就能看出来）
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: 00-launch

# 1) 等首屏出现：连接面板 / 演示模式 / 直接进音色页，任一即可
- extendedWaitUntil:
    visible: ".*(连接设备|CONNECT|蓝牙|BLUETOOTH|演示模式|DEMO MODE|音色|TONE).*"
    timeout: 60000
- takeScreenshot: 01-first-screen

# 2) 演示模式按钮可能在折叠区下方，先滚动找一次（找不到就跳过，交给截图定位）
- scrollUntilVisible:
    element:
      text: ".*(演示模式|DEMO MODE).*"
    direction: DOWN
    timeout: 15000
    optional: true

- tapOn:
    text: ".*(演示模式|DEMO MODE).*"
    optional: true
- takeScreenshot: 02-after-demo-tap

# 3) 等虚拟设备连上、进入音色页
- extendedWaitUntil:
    visible: ".*(音色|TONE).*"
    timeout: 45000
- takeScreenshot: 03-tone-page

# 4) 音色页：点噪声门卡片，确认点击有响应
- tapOn:
    text: ".*(噪声门|NOISE GATE|GATE).*"
    optional: true
- takeScreenshot: 04-tone-after-tap

# 5) 本地音色库
- tapOn: ".*(我的音色库|LOCAL).*"
- extendedWaitUntil:
    visible: ".*(我的音色库|DIRECT|DI-PASSIVE).*"
    timeout: 20000
- takeScreenshot: 05-local-bank
- tapOn:
    text: ".*(DI-PASSIVE|DIRECT).*"
    optional: true
- takeScreenshot: 06-local-bank-selected

# 6) 预设库
- tapOn: ".*(预设库|PRESETS).*"
- extendedWaitUntil:
    visible: ".*(预设库|PRESETS|调音器|TUNER).*"
    timeout: 20000
- takeScreenshot: 07-presets

# 7) 社区（未登录显示连接门/登录页，属预期）
- tapOn: ".*(社区|SOCIAL).*"
- extendedWaitUntil:
    visible: ".*(先连接 BFX1 设备|音色社区|用户名|Connect|Username).*"
    timeout: 25000
- takeScreenshot: 08-community

# 8) 账号入口
- tapOn: ".*(音色|TONE).*"
- tapOn: ".*(我的账号|My account).*"
- extendedWaitUntil:
    visible: ".*(我的账号|用户名|Username).*"
    timeout: 20000
- takeScreenshot: 09-account
