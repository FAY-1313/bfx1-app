name: iOS CI (TestFlight)

on:
  workflow_dispatch:        # 手动触发（Actions 页面 ▸ Run workflow）
  push:
    branches: [ ios-ci ]    # 推到 ios-ci 分支自动构建

# 必须权限：读取代码 + 上传产物
permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-latest   # 自带 Xcode + Swift；Capacitor 8 SPM 模式无需 CocoaPods
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build web bundle
        run: npm run build     # 产出 dist/（capacitor.config.webDir）

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      # ★ 关键：cap sync 会重置 Info.plist，必须再注入 iOS 必需键
      - name: Patch Info.plist (BLE / mic / ATS)
        run: bash scripts/patch_ios_plist.sh ios/App/App/Info.plist

      - name: Decode signing cert & profile
        env:
          P12_B64:        ${{ secrets.IOS_CERT_P12 }}
          P12_PW:         ${{ secrets.IOS_CERT_PASSWORD }}
          PROFILE_B64:    ${{ secrets.IOS_PROVISIONING_PROFILE }}
          KEYCHAIN_PW:    ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          security create-keychain -p "$KEYCHAIN_PW" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PW" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          echo "$P12_B64" | base64 --decode > cert.p12
          security import cert.p12 -k build.keychain -P "$P12_PW" -T /usr/bin/codesign
          # ★ 关键：不放开私钥访问权限，codesign 会以 “interaction is not allowed” 失败
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" build.keychain > /dev/null
          security list-keychains -d user -s build.keychain login.keychain-db
          security find-identity -v -p codesigning build.keychain
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "$PROFILE_B64" | base64 --decode > ~/Library/MobileDevice/Provisioning\ Profiles/profile.mobileprovision

      # ★ p12 里只有叶子证书：codesign 需要 WWDR G3 中间证书才能建立完整信任链。
      #   必须在上一步 import p12 之后、archive 之前安装。
      - name: Install WWDR G3 intermediate
        run: |
          curl -fsSL -o /tmp/AppleWWDRCAG3.cer https://www.apple.com/certificateauthority/AppleWWDRCAG3.cer
          security import /tmp/AppleWWDRCAG3.cer -k build.keychain -T /usr/bin/codesign
          security find-identity -v -p codesigning build.keychain

      - name: Resolve workspace/scheme
        id: cap
        working-directory: ios/App
        run: |
          if [ -d App.xcworkspace ]; then
            echo "wsflag=workspace" >> "$GITHUB_OUTPUT"
            echo "ws=App.xcworkspace" >> "$GITHUB_OUTPUT"
          else
            echo "wsflag=project" >> "$GITHUB_OUTPUT"
            echo "ws=App.xcodeproj" >> "$GITHUB_OUTPUT"
          fi

      - name: Archive
        working-directory: ios/App
        env:
          TEAM:    ${{ secrets.APPLE_TEAM_ID }}
          PROFILE: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          WSFLAG="${{ steps.cap.outputs.wsflag }}"
          WS="${{ steps.cap.outputs.ws }}"
          # ★ 每次上传 TestFlight 的 build 号必须比上一次大，否则 altool 直接拒收。
          #   基准 122（与 app build.gradle 对齐），用 CI 运行序号叠加，永不重复。
          BUILD_NO=$(( 122 + GITHUB_RUN_NUMBER ))
          echo "build number = $BUILD_NO"
          xcodebuild -$WSFLAG "$WS" -scheme App -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/App.xcarchive \
            CURRENT_PROJECT_VERSION="$BUILD_NO" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM="$TEAM" \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="$PROFILE" \
            clean archive

      - name: Export IPA
        working-directory: ios/App
        env:
          TEAM: ${{ secrets.APPLE_TEAM_ID }}
          PROFILE: ${{ secrets.IOS_PROFILE_NAME }}
        run: |
          sed -i '' "s/YOUR_TEAM_ID/$TEAM/" ../../scripts/exportOptions.plist
          sed -i '' "s/__PROFILE_NAME__/$PROFILE/" ../../scripts/exportOptions.plist
          xcodebuild -exportArchive \
            -archivePath build/App.xcarchive \
            -exportPath build \
            -exportOptionsPlist ../../scripts/exportOptions.plist

      - name: Upload to TestFlight (App Store Connect API)
        env:
          API_P8_B64: ${{ secrets.APPSTORE_API_KEY_P8 }}
          KEY_ID:     ${{ secrets.APPSTORE_KEY_ID }}
          ISSUER:     ${{ secrets.APPSTORE_ISSUER_ID }}
        run: |
          mkdir -p ~/.private_keys
          echo "$API_P8_B64" | base64 --decode > ~/.private_keys/AuthKey_${KEY_ID}.p8
          xcrun altool --upload-app \
            -f ios/App/build/App.ipa \
            --apiKey "$KEY_ID" \
            --apiIssuer "$ISSUER"
          # 注：若 Xcode 移除 altool，改用 fastlane pilot：
          #   fastlane pilot upload -i ios/App/build/App.ipa -u <appleid> --api_key_path AuthKey.json

      - name: Upload artifact (fallback)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: BFX1-iOS-IPA
          path: ios/App/build/App.ipa
          if-no-files-found: ignore

  # ══════════════════════════════════════════════════════════════════
  # 模拟器 UI 冒烟（Maestro · 多机型）
  #   不签名、不上传，只在 iPhone / iPad 模拟器上跑 .maestro/*.yaml，
  #   每步截图；任一机型失败即整体失败。用于 UI 回归，不替代真机蓝牙测试。
  # ══════════════════════════════════════════════════════════════════
  maestro-smoke:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install deps
        run: npm ci

      - name: Build web bundle
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Patch Info.plist (BLE / mic / ATS)
        run: bash scripts/patch_ios_plist.sh ios/App/App/Info.plist

      - name: Build for simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO build

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Run smoke flows on iPhone / iPad simulators
        run: |
          set -o pipefail
          APP_DIR=$(find build/DerivedData/Build/Products/Debug-iphonesimulator -maxdepth 1 -name "App.app" | head -1)
          echo "app bundle: $APP_DIR"
          if [ -z "$APP_DIR" ]; then echo "::error::App.app not found"; exit 1; fi

          LIST=$(xcrun simctl list devices available)
          echo "--- available simulators (前 40 行) ---"
          echo "$LIST" | sed -n '1,40p'
          pick_line() { echo "$LIST" | grep -E "^[[:space:]]+$1" | head -1 || true; }

          # 机型名因 Xcode 版本而异，这里按「优先 SE，其次任意 iPhone」和「优先 iPad mini」动态挑
          IPHONE=$(pick_line 'iPhone.*SE')
          [ -z "$IPHONE" ] && IPHONE=$(pick_line 'iPhone')
          IPAD=$(pick_line 'iPad mini')
          [ -z "$IPAD" ] && IPAD=$(pick_line 'iPad')

          FAILED=0
          for LINE in "$IPHONE" "$IPAD"; do
            [ -z "$LINE" ] && continue
            NAME=$(echo "$LINE" | sed -E 's/^[[:space:]]+//; s/ \([0-9A-Fa-f-]{36}\).*//')
            UDID=$(echo "$LINE" | sed -E 's/.*\(([0-9A-Fa-f-]{36})\).*/\1/')
            echo "=== $NAME / $UDID ==="

            xcrun simctl boot "$UDID" 2>/dev/null || true
            xcrun simctl bootstatus "$UDID" -b || true
            xcrun simctl install "$UDID" "$APP_DIR"

            # 失败时补一份视图层级 + 截图 + App 日志，便于定位「文案断言不中」
            if ! maestro test .maestro --device "$UDID"; then
              FAILED=1
              echo "--- hierarchy after failure ---"
              maestro hierarchy 2>&1 | head -80 || true
              echo "--- app log (last 3m) ---"
              xcrun simctl spawn "$UDID" log show --last 3m --predicate 'process == "App"' 2>&1 | tail -50 || true
              xcrun simctl io "$UDID" screenshot "$RUNNER_TEMP/fail-$(echo "$NAME" | tr ' ()' '____').png" || true
            fi
            xcrun simctl shutdown "$UDID" || true
          done
          exit $FAILED

      - name: Upload Maestro artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-artifacts
          path: |
            ~/.maestro/tests
            maestro-artifacts
            ${{ runner.temp }}/fail-*.png
            build/DerivedData/Build/Products/Debug-iphonesimulator/App.app
          if-no-files-found: ignore
