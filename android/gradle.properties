# Project-wide Gradle settings.

# 内存 + 编码（UTF-8 必须显式设，否则中文路径下的资源会乱码）
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8

# 并行 / 缓存
org.gradle.parallel=true
org.gradle.caching=true

# AndroidX
android.useAndroidX=true

# ★ 2026-10-03: 工程路径含中文（...\APK开发\...），AGP 默认会拒绝构建。
#   该检查是保守警告；实测中文路径在现代 AGP + Windows 上可正常构建。
android.overridePathCheck=true

# Jetifier：依赖已全部 AndroidX，关掉可加快构建
android.enableJetifier=false

# ★ 2026-10-15: AGP 自带的 aapt2 位于中文路径(GRADLE_USER_HOME 在 "APK开发" 下)时会
#   "failed to load XML file: Error 15100 / error 13". 实测同一 exe 复制到纯 ASCII
#   路径即正常 —— 故显式指定 ASCII 路径下的 aapt2。
android.aapt2FromMavenOverride=C:/bfx1build/aapt2.exe
